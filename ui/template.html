<div id="forecast-container"></div>

<template id="forecast-template">
  <section class="forecast-item">
    <p class="tag" data-day-cast></p>
    <img data-icon-cast src="./assets/icons/wi_not-available.svg" alt="">
    <div>
      <h6>min. </h6>
      <p><span data-tempMin-cast></span>°C</p>
    </div>
    <div>
      <h6>max. </h6>
      <p><span data-tempMax-cast></span>°C</p>
    </div>
    <div class="regen">
      <img src="./assets/wi_umbrella.svg" alt="">
      <p data-regen-cast></p>
    </div>

  </section>
</template>
